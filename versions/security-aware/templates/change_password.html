{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block content %}
<section class="page-hero compact"><span class="eyebrow">Security</span><h1>Change password</h1><p>Choose a strong password you don't use elsewhere.</p></section>
<div class="form-card wide"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" required maxlength="128" autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="12" maxlength="128" autocomplete="new-password"><small>At least 12 characters.</small></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="btn primary">Update password</button></form></div>{% endblock %}
