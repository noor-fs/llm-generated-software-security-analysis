{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}<section class="page-shell narrow-shell"><div class="page-top"><div><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change password</h1><p class="muted">Choose a new password for your DemoBank account.</p></div></div><section class="panel settings-panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Current password<input type="password" name="current_password" required autocomplete="current-password"></label><label>New password<input type="password" name="new_password" required minlength="10" maxlength="128" autocomplete="new-password"><small>Use at least 10 characters.</small></label><label>Confirm new password<input type="password" name="confirm_password" required minlength="10" maxlength="128" autocomplete="new-password"></label><button class="btn btn-primary" type="submit">Update password</button></form></section></section>{% endblock %}
