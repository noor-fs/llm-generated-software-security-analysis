{% extends "base.html" %}{% block title %}Profile{% endblock %}
{% block content %}<section class="page-shell narrow-shell"><div class="page-top"><div><span class="eyebrow">YOUR DETAILS</span><h1>Profile settings</h1><p class="muted">Keep your contact details up to date.</p></div></div><section class="panel settings-panel"><div class="profile-header"><div class="avatar">{{ user.full_name[:1]|upper }}</div><div><h2>{{ user.full_name }}</h2><p class="muted">@{{ user.username }}</p></div></div><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Full name<input name="full_name" value="{{ user.full_name }}" required maxlength="100" autocomplete="name"></label><label>Username<input value="{{ user.username }}" disabled><small>Username cannot be changed.</small></label><label>Email address<input value="{{ user.email }}" disabled><small>Email changes are disabled in this academic version.</small></label><label>Phone number <span class="optional">(optional)</span><input name="phone" value="{{ user.phone }}" maxlength="30" autocomplete="tel"></label><button class="btn btn-primary" type="submit">Save changes</button></form></section></section>{% endblock %}
