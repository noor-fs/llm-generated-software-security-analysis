{% extends 'base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="auth-layout"><div class="auth-intro"><span class="eyebrow">WELCOME BACK</span><h1>Good to have you here.</h1><p>Your finances, simplified — in one secure-feeling virtual space.</p><img src="{{ url_for('static',filename='img/auth.svg') }}" alt="Decorative abstract banking illustration"></div><div class="panel auth-panel"><h2>Sign in</h2><p class="muted">Access your DemoBank account.</p><form method="post" class="form"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Username or email<input name="identifier" autocomplete="username" required autofocus value="{{ request.form.get('identifier','') }}"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-wide">Sign in →</button></form><p class="form-foot">New to DemoBank? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
