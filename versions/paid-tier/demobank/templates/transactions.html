{% extends 'base.html' %}{% block title %}Transactions{% endblock %}{% block content %}<div class="page-header"><div><span class="eyebrow">TRANSACTION HISTORY</span><h1>Every move, in one place.</h1><p>Browse your virtual money transfers.</p></div><a class="btn" href="{{ url_for('transfer') }}">↗ New transfer</a></div><section class="panel activity-panel"><form method="get" class="filters"><label>Search<input name="q" value="{{ query }}" placeholder="Name, description or account"></label><label>Type<select name="type"><option value="" {{ 'selected' if not typ }}>All activity</option><option value="incoming" {{ 'selected' if typ=='incoming' }}>Incoming</option><option value="outgoing" {{ 'selected' if typ=='outgoing' }}>Outgoing</option></select></label><label>From<input type="date" name="start" value="{{ start }}"></label><label>To<input type="date" name="end" value="{{ end }}"></label><button class="btn">Apply filters</button><a href="{{ url_for('transactions') }}" class="text-link">Clear</a></form>{% include '_transactions.html' %}</section>{% endblock %}
